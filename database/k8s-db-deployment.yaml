apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mssql-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mssql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mssql
  template:
    metadata:
      labels:
        app: mssql
    spec:
      containers:
      - name: mssql
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: SA_PASSWORD
          value: "YourStrong!Passw0rd"
        - name: MSSQL_PID
          value: "Express"
        ports:
        - containerPort: 1433
        volumeMounts:
        - name: mssql-data
          mountPath: /var/opt/mssql
        - name: init-db
          mountPath: /docker-entrypoint-initdb.d
      volumes:
      - name: mssql-data
        persistentVolumeClaim:
          claimName: mssql-data
      - name: init-db
        configMap:
          name: mssql-initdb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mssql-initdb
  labels:
    app: mssql
data:
  init-db.sql: |
    CREATE DATABASE JunkiappDB;
    GO
    USE JunkiappDB;
    GO
    CREATE TABLE users (
        id INT PRIMARY KEY IDENTITY,
        username NVARCHAR(100) NOT NULL,
        email NVARCHAR(255) NOT NULL,
        password_hash NVARCHAR(255) NOT NULL,
        created_at DATETIME DEFAULT GETDATE()
    );
    GO
    CREATE TABLE junk_items (
        id INT PRIMARY KEY IDENTITY,
        user_id INT NOT NULL,
        title NVARCHAR(255) NOT NULL,
        description NVARCHAR(MAX),
      latitude FLOAT,
      longitude FLOAT,
        created_at DATETIME DEFAULT GETDATE(),
        FOREIGN KEY (user_id) REFERENCES users(id)
    );
    GO
    CREATE TABLE junk_pictures (
      id INT PRIMARY KEY IDENTITY,
      junk_item_id INT NOT NULL,
      image_url NVARCHAR(512) NOT NULL,
      uploaded_at DATETIME DEFAULT GETDATE(),
      FOREIGN KEY (junk_item_id) REFERENCES junk_items(id)
    );
    GO
---
apiVersion: v1
kind: Service
metadata:
  name: mssql-service
spec:
  type: NodePort
  selector:
    app: mssql
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
      nodePort: 31433
