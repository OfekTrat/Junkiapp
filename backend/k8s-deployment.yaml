apiVersion: apps/v1
kind: Deployment
metadata:
  name: junkiapp-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: junkiapp-backend
  template:
    metadata:
      labels:
        app: junkiapp-backend
    spec:
      containers:
      - name: junkiapp-backend
        image: junkiapp-backend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: junkiapp-backend-service
spec:
  type: NodePort
  selector:
    app: junkiapp-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
